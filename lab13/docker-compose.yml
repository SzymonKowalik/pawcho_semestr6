services:
  mysql:
    container_name: lab13_mysql
    image: mysql:8.4.9
    networks:
      - backend
    environment:
      MYSQL_ROOT_PASSWORD: $DB_PASSWORD
      MYSQL_DATABASE: $DB_DATABASE
    volumes:
      - mysql_data:/var/lib/mysql

  php:
    container_name: lab13_php
    image: php:8.5.7-fpm-alpine3.22
    networks:
      - backend
    volumes:
      - ./src:/var/www/html:z

  nginx:
    container_name: lab13_nginx
    image: nginx:1.31.1-alpine-perl
    networks:
      - frontend
      - backend
    ports:
      - "4001:80"
    volumes:
      - ./src:/var/www/html:z
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:z
    depends_on:
      - php

  phpmyadmin:
    container_name: lab13_phpmyadmin
    image: phpmyadmin/phpmyadmin:5.2.3
    networks:
      - backend
    ports:
      - "6001:80"
    environment:
      PMA_HOST: lab13_mysql

networks:
  frontend:
  backend:

volumes:
  mysql_data:
